services:
  part-viewer:
    image: solutions-part-viewer:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        APP_BASE_PATH: /part-viewer/
    container_name: duramark-part-viewer
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      APP_ORIGIN: https://duramark.jays-apps.com
      COOKIE_SECURE: "true"
      COOKIE_PATH: /part-viewer/
      DB_PATH: /app/data/part-viewer.sqlite
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - part-viewer-data:/app/data
    networks:
      - apps_proxy
    mem_limit: 768m
    memswap_limit: 1536m
volumes:
  part-viewer-data:
networks:
  apps_proxy:
    external: true
